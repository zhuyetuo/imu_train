# 给随机森林一次**公平**的机会：按端侧真正塞得下的那一格重训。
#
# **这是新增文件，configs/ml.yaml 和 configs/ml_edge.yaml 都一个字没动。**
#
# 为什么要单独训这一版：algo_tinyml 那边扫出来的"20 棵 × 深度 10 = 97.2 KB"
# 是**就地截断**的结果——把一棵不限深训好的树在第 10 层砍掉。它跟"训练时就设
# max_depth=10"不等价，而且是**悲观的下界**：原来那些分裂点是冲着"后面还要再
# 分好几层"选的，半路砍掉用的是并非为浅树优化的分裂。
#
# 截断版实测（留出集 23712 条，目标「抓挠」）：
#   窗口 P 0.844 / R 0.590 / F1 0.695，事件 F1 0.706
# 对照 CNN [64,128,128] int8：抓挠 F1 0.759，事件 F1 0.788，78.6 KB
#
# 所以 RF 现在落后 8 个百分点，但那 8 个点里有多少是"截断"造成的、
# 多少是 RF 这条路本身的上限，**不重训就分不清**。不重训就下结论，
# 等于用一个已知偏低的数把 RF 判出局。
#
# 参数取值直接对应 algo_tinyml 网格里预算内最好的那一格：
#   20 棵 × 深度 10 → 紧凑编码（6 B/节点）+ uint8 叶子 ≈ 97.2 KB
#
# ⚠ **这里不能写 min_samples_leaf**：src/ml/models/random_forest.py 的 build_rf
# 只读 n_estimators / max_depth / n_jobs / random_state 四个键，写了会被静默
# 忽略——那比不写更糟，人会以为自己设过了。要调这个杠杆，训完之后用
# algo_tinyml 的 python/prune_rf.py --min-samples-leaf 事后剪。
#
# 用法：
#   python src/ml/train.py --hz 16 --model rf \
#     --config configs/ml_edge_rf.yaml \
#     --processed_dir data/processed_2026_8_11-2026_8_27_raw_missing_drop_window \
#     --remap configs/remap_custom_3class.yaml \
#     --results_dir results_edge_rf

random_forest:
  n_estimators: 20
  max_depth: 10
  n_jobs: -1
  random_state: 42

# 下面这些不是这次要训的，原样抄过来只是为了配置文件能被完整加载
xgboost:
  n_estimators: 50
  max_depth: 6
  learning_rate: 0.2
  n_jobs: -1
  random_state: 42

lightgbm:
  n_estimators: 50
  max_depth: 6
  num_leaves: 31
  learning_rate: 0.2
  n_jobs: -1
  random_state: 42

catboost:
  iterations: 50
  depth: 6
  learning_rate: 0.2
  random_state: 42

extra_trees:
  n_estimators: 300
  max_depth: null
  n_jobs: -1
  random_state: 42

svm:
  C: 1.0
  kernel: rbf
  probability: true

histgb:
  n_estimators: 300
  max_depth: null
  learning_rate: 0.1
  random_state: 42

features:
  time_domain: [mean, std, min, max, range, rms, skewness, kurtosis, zero_crossing_rate]
  freq_domain: [spectral_mean, spectral_std, dominant_freq, spectral_entropy]
