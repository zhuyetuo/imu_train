# 端侧版 CNN（激进档）：三层全部减半
#
# 体积 34.7 KB，是现在 [64,128,256] 那版（129.3 KB）的 1/3.7。
#
# 为什么敢这么砍：窗口只有 16 个点（1 秒 @16Hz）、5 个类别、两万多条留出集。
# 256 个通道在这个规模上几乎肯定是过拟合容量——真实信息量撑不住那么多卷积核。
# 如果这一版的 int8 macro-F1 跟保守档差不多，那说明宽度本来就是浪费的，
# 省下的 ~95 KB flash 可以留给别的（更长的窗口、或者同时放一个 RF 做交叉校验）。
#
# **这是个实验，不是结论。** 掉多少点只有跑完才知道，两档都训，比着看。
#
# 除 filters 外的所有超参跟 configs/dl.yaml 完全一致：只改一个变量，
# 掉的点才能归因到"窄了"，而不是"顺便还调了别的"。
#
# 用法（--results_dir 指到别处，不覆盖已有产物）：
#
#   python src/dl/train.py --hz 16 --model cnn \
#       --config configs/dl_edge_32_64_128.yaml \
#       --processed_dir data/processed_2026_8_11-2026_8_27_raw_missing_drop_window \
#       --remap configs/remap_custom_3class.yaml \
#       --results_dir results_edge_32_64_128
#
# 产物：results_edge_32_64_128/<dataset_tag>/16hz_remap_custom_3class/dl_cnn_best.pt
# 接着用 algo_tinyml 的 export_cnn.py 量化并实测。

epochs: 200
batch_size: 64
learning_rate: 0.0005
early_stopping_patience: 30
num_classes: 7

cnn:
  filters: [32, 64, 128]
  kernel_size: 3
  dropout: 0.3
