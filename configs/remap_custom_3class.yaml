# 自采数据全标签 → 3类重映射：活动 / 睡觉 / 抓挠
# 数据够了之后，把对应行删掉即可拆出新类别训练
#
# "未佩戴"故意不在这份映射里——它不是狗的行为，是设备没戴在狗身上，
# 训练行为分类器不该把这类样本也当成某种行为塞进去(见src/ml/train.py
# 的apply_remap()，会自动过滤掉remap里没覆盖到的类别，不会报错；未佩戴/
# 静置检测是单独一套机制，见src/data/wear_state.py)。以后如果CSV标注
# 里出现新的类别名、但这里忘了加映射，也会被同样悄悄过滤掉——训练日志
# 会打印"丢弃了N个remap配置没覆盖到的样本"，不是预期的话要检查是不是
# 漏配了。
活动:     活动
睡觉:     睡觉
抓挠:     抓挠
跳跃:     活动
舔身体:   活动
啃身体:   活动
奔跑:     活动
行走:     活动
进食:     活动
饮水:     活动
蹭擦身体: 活动
嗅闻:     活动
戴摘项圈: 活动
伸懒腰:   活动
项圈松动: 活动
# 未佩戴: (故意不写映射，见上面的说明——排除出训练，不是漏配)
# 甩身体: (故意不写映射——不算活动，排除出训练，不是漏配)
