# 自采数据全标签 → 3类重映射：活动 / 睡觉 / 抓挠
# 数据够了之后，把对应行删掉即可拆出新类别训练
#
# "未佩戴"、"甩身体"暂时改回故意不写映射——排除出训练，不是漏配。
# 之前试过把两者映射到各自专属标签一起训练，结果抓挠指标下降，暂时先
# 改回老的排除方式，跟之前单独用2026_7_17-2026_7_29训练时的类别定义
# 对齐，控制变量重新对比一次混合数据的效果。
# （见src/ml/train.py的apply_remap()，会自动过滤掉remap里没覆盖到的
# 类别，不会报错；未佩戴/静置检测是单独一套机制，见src/data/wear_state.py）
# 以后如果CSV标注里出现新的类别名、但这里忘了加映射，也会被同样悄悄
# 过滤掉——训练日志会打印"丢弃了N个remap配置没覆盖到的样本"，不是
# 预期的话要检查是不是漏配了。
