# 自采数据全标签 → 重映射：活动 / 睡觉 / 抓挠 / 未佩戴 / 甩身体
#
# "未佩戴"、"甩身体"各自映射到自己专属的标签，不并入活动/睡觉/抓挠——
# 未佩戴不是狗的行为，是设备没戴在狗身上；甩身体不算清晰的"活动"。
# 两者都写在映射表里，作为独立的训练类别参与训练，不是被过滤掉。
# （注：src/data/wear_state.py另有一套独立的未佩戴/静置检测机制，跟这里
# 训练行为分类器时把"未佩戴"当第4类是两码事，互不影响）
#
# 以后如果CSV标注里出现新的类别名、但这里忘了加映射，会被
# src/ml/train.py的apply_remap()悄悄过滤掉（训练日志会打印"丢弃了N个
# remap配置没覆盖到的样本"）——不是预期的话要检查是不是漏配了。
#
# 数据够了之后，把对应行删掉即可拆出新类别训练
活动:     活动
睡觉:     睡觉
抓挠:     抓挠
未佩戴:   未佩戴
甩身体:   甩身体
跳跃:     活动
舔身体:   活动
啃身体:   活动
奔跑:     活动
行走:     活动
进食:     活动
饮水:     活动
蹭擦身体: 活动
嗅闻:     活动
戴摘项圈: 活动
伸懒腰:   活动
项圈松动: 活动
