# 端侧版 CNN（保守档）：只把第三层卷积从 256 收到 128
#
# 为什么只动第三层：一维卷积的权重是 out_ch × in_ch × k，逐层拆开之后
# conv 128→256 一层就占了整个模型的 77.4%（98,304 / 126,976 个权重）。
# 前面两层加起来才 20.6%，动它们省不下多少，却会削掉感受野和低层特征的容量。
#
#   conv 8→64   k3 :  1,536   1.2%
#   conv 64→128 k3 : 24,576  19.4%
#   conv 128→256 k3: 98,304  77.4%   ← 只动这一层
#   dense 512→5    :  2,560   2.0%
#
# 改完的体积：78.6 KB（原来 129.3 KB，超 GR5513 的 128 KB 预算 1.3 KB）。
#
# 除 filters 外的所有超参跟 configs/dl.yaml 完全一致——只改一个变量，
# 掉的点才能归因到"窄了"，而不是"顺便还调了学习率"。
#
# 用法见 configs/dl_edge_32_64_128.yaml 顶部的注释。

epochs: 200
batch_size: 64
learning_rate: 0.0005
early_stopping_patience: 30
num_classes: 7

cnn:
  filters: [64, 128, 128]
  kernel_size: 3
  dropout: 0.3
