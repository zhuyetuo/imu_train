# label_service（数据标注平台用的 AI 服务：推理 + 训练 + 牙齿/皮肤规则）
#
#   cd label_service && bash up.sh          起服务（后台常驻，不再占着终端）
#   docker compose logs -f label-service    看日志
#
# 仓库整个挂进 /app：改代码重启容器就生效，训练产出直接落在宿主机仓库里。
services:
  label-service:
    build:
      context: ..
      dockerfile: label_service/Dockerfile
      args:
        # 构建慢就换源。默认已经是国内镜像；要用官方源填 https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        # torch 的 CPU 版（容器没 GPU，装默认版会白拉几个 G 的 CUDA 轮子）
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: imu-train-label-service
    restart: unless-stopped
    env_file:
      # 没有这个文件也能起，全部走 config.py 里的默认值
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # NAS 在容器里的路径跟宿主机保持一致，接口里传的相对路径两边才对得上
      NAS_ROOT: ${NAS_ROOT:-/home/toky/ai_data}
      MATERIAL_ROOT: ${MATERIAL_ROOT:-/home/toky/alg_material}
      LABEL_SERVICE_PORT: 8383
      # 额外挂几个模型给平台做对比（见 registry.py）。**必须在这里透传**：
      # 不列出来的话，`LABEL_MODELS=... bash up.sh` 那个变量只到了宿主机的
      # shell，容器里看不到——服务照常起、日志一切正常，只是平台的下拉里
      # 少一组，人会以为是平台没刷新。
      #
      # 默认空字符串 = 没有额外模型 = 原来的行为。
      # **LABEL_MODEL（单数，默认模型）故意不放这里**：它在 config.py 里有
      # 非空默认值，透传一个空字符串进来会把默认模型路径清掉，服务直接起不来。
      # 要改默认模型就写进 .env（env_file 那条已经读了）。
      LABEL_MODELS: ${LABEL_MODELS:-}
      # 端侧那条线：algo_tinyml 挂在 /algo_tinyml（下面 volumes），「导出到端侧」调
      # 它的导出脚本，导完让旁边的 edge-service 重新加载
      ALGO_TINYML_DIR: /algo_tinyml
      EDGE_SERVICE_URL: http://edge-service:8900
    ports:
      - "${LABEL_SERVICE_PORT:-8383}:8383"
    volumes:
      # 代码 + 模型 + 训练产出，读写挂载（训练要往 data/、results/、tmp/ 写）
      - ..:/app
      # 原始数据（推理读 CSV、训练读视频/CSV）
      - ${NAS_ROOT_HOST:-/home/toky/ai_data}:${NAS_ROOT:-/home/toky/ai_data}
      # 素材库（牙齿/皮肤照片），只读
      - ${MATERIAL_ROOT_HOST:-/home/toky/alg_material}:${MATERIAL_ROOT:-/home/toky/alg_material}:ro
      # 端侧那套代码（上层 up.sh deploy 会 clone / pull）。导出目录和本地模型清单
      # 都写在里面，edge-service 挂的是同一个目录，所以它 reload 就看得到
      - ${ALGO_TINYML_HOST:-/home/toky/algo_tinyml}:/algo_tinyml
    # 推理是多进程池（默认 CPU 核数 - 2），训练更吃 CPU，别限制得太死
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8383/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 模型加载 + 进程池预热要一会儿，给足启动时间再开始判健康
      start_period: 120s

  # ── 端侧模型服务（端口 8900）────────────────────────────────────────────
  # 跑的是板上那份 C（algo_tinyml），给平台回答"这个模型烧到项圈上会是什么效果"。
  # 现在还没有板子，所以要有这么个服务；有了板子它也还是模型对比那页的依据。
  #
  # 为什么放在这里、用同一个镜像：它复用 imu_train 的整条预处理链和 label_service
  # 的后处理（同一份代码），依赖跟 label-service 一模一样；分开管的话就是两套
  # 启停、两份日志、两处要记得部署。algo_tinyml 只是代码库，不单独起服务。
  edge-service:
    image: ${LABEL_IMAGE:-imu-train-label-service}
    restart: unless-stopped
    depends_on:
      - label-service
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: >
      python -u /algo_tinyml/service/edge_service.py
        --models /algo_tinyml/edge_models.json
        --imu-train /app
        --nas-root ${NAS_ROOT:-/home/toky/ai_data}
        --resample training_match
        --host 0.0.0.0 --port 8900 --strict-port
    ports:
      - "${EDGE_SERVICE_PORT:-8900}:8900"
    volumes:
      - ..:/app
      - ${NAS_ROOT_HOST:-/home/toky/ai_data}:${NAS_ROOT:-/home/toky/ai_data}
      - ${ALGO_TINYML_HOST:-/home/toky/algo_tinyml}:/algo_tinyml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8900/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 起来要先把每个模型的 C 编一遍、过 golden 自检
      start_period: 120s
